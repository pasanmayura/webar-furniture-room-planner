<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Furniture Marker AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        a-scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas.a-canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #marker-status {
            position: fixed;
            z-index: 1;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            margin: 0;
            padding: 0.75rem 1rem;
            color: #ffffff;
            background: rgba(35, 38, 31, 0.78);
            border-radius: 0.5rem;
            font: 500 0.95rem/1.4 Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>
<p id="marker-status">Point your camera at the furniture marker.</p>

    <a-scene
        id="marker-scene"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        color-space="sRGB"
        renderer="colorManagement: true; logarithmicDepthBuffer: true"
    >

        <!--
          NOTE: we no longer use <a-assets>/<a-asset-item> here.
          The model URL depends on the "product" query param, which we
          only know once this script runs — and <a-gltf-model src="#id">
          resolves against the asset item at component-init time, before
          our JS ever gets a chance to set that asset's src. Setting the
          model's src directly (below, in JS) avoids that timing bug
          entirely and is the more reliable approach for a model chosen
          at runtime.
        -->

        <a-entity id="furniture-target" mindar-image-target="targetIndex: 0">
            <a-gltf-model
                id="furniture-model"
                position="0 0 0.1"
                rotation="0 0 0"
                scale="1 1 1"
            ></a-gltf-model>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 2" position="1 3 2"></a-entity>

    </a-scene>

    <script>
        const furnitureOptions = {
            chair: {
                name: "Modern Lounge Chair",
                model: "/models/chair.glb",
                marker: "/markers/chair-target.mind"
            },
            table: {
                name: "Modern Dining Table",
                model: "/models/table.glb",
                marker: "/markers/table-target.mind"
            },
            bed: {
                name: "Modern Double Bed",
                model: "/models/bed.glb",
                marker: "/markers/bed-target.mind"
            }
        };

        const productId = new URLSearchParams(window.location.search).get("product");
        const furniture = furnitureOptions[productId] || furnitureOptions.chair;
        const scene = document.getElementById("marker-scene");
        const model = document.getElementById("furniture-model");
        const status = document.getElementById("marker-status");

        document.title = `${furniture.name} - Marker AR`;
        scene.setAttribute("mindar-image", `imageTargetSrc: ${furniture.marker}; autoStart: true; uiScanning: yes; uiLoading: yes;`);

        // Set the model's src directly to the .glb URL instead of pointing
        // it at an <a-asset-item>. This triggers a proper (re)load of the
        // gltf-model component right now, with the correct binary fetch,
        // instead of depending on an asset item that had no src when the
        // scene first initialized.
        model.setAttribute("gltf-model", furniture.model);

        model.addEventListener("model-loaded", (event) => {
            const threeModel = event.detail.model;
            const three = AFRAME.THREE;
            const bounds = new three.Box3().setFromObject(threeModel);
            const size = bounds.getSize(new three.Vector3());
            const center = bounds.getCenter(new three.Vector3());
            const maxDimension = Math.max(size.x, size.y, size.z, 0.001);

            threeModel.position.sub(center);
            threeModel.scale.setScalar(0.7 / maxDimension);

            // Reset the entity's own position/scale to identity so the
            // fit-to-size scale set on threeModel above is the ONLY scale
            // applied — previously this entity also carried a hardcoded
            // "0.2 0.2 0.2" scale, which multiplied with the auto-fit
            // scale and could shrink the model to near-invisible.
            model.setAttribute("position", "0 0 0");
            model.setAttribute("scale", "1 1 1");

            status.textContent = `${furniture.name} ready. Point your camera at the marker.`;
        });

        model.addEventListener("model-error", (event) => {
            console.error("GLTF load error:", event.detail);
            status.textContent = `Unable to load the ${furniture.name.toLowerCase()} model.`;
        });

        document.getElementById("furniture-target").addEventListener("targetFound", () => {
            status.textContent = `${furniture.name} detected.`;
        });

        document.getElementById("furniture-target").addEventListener("targetLost", () => {
            status.textContent = "Point your camera at the furniture marker.";
        });
    </script>

</body>
</html>
