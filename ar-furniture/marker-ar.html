<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Furniture Marker AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        a-scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            /* Stop the browser from treating drag gestures on the canvas
               as page scroll/zoom, so our rotate-drag works cleanly on touch. */
            touch-action: none;
        }

        canvas.a-canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #marker-status {
            position: fixed;
            z-index: 2;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            margin: 0;
            padding: 0.75rem 1rem;
            color: #ffffff;
            background: rgba(35, 38, 31, 0.78);
            border-radius: 0.5rem;
            font: 500 0.95rem/1.4 Arial, sans-serif;
            text-align: center;
        }

    </style>
</head>

<body>
<p id="marker-status">Point your camera at the furniture marker.</p>

    <a-scene
        id="marker-scene"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        color-space="sRGB"
        renderer="colorManagement: true; logarithmicDepthBuffer: true"
    >

        <a-entity id="furniture-target" mindar-image-target="targetIndex: 0">
            <a-gltf-model
                id="furniture-model"
                position="0 0 0.1"
                rotation="0 0 0"
                scale="1 1 1"
                visible="false"
            ></a-gltf-model>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 2" position="1 3 2"></a-entity>

    </a-scene>

    <script>
        const furnitureOptions = {
            chair: {
                name: "Modern Lounge Chair",
                model: "/models/chair.glb",
                marker: "/markers/chair-target.mind"
            },
            table: {
                name: "Modern Dining Table",
                model: "/models/table.glb",
                marker: "/markers/table-target.mind"
            },
            bed: {
                name: "Modern Double Bed",
                model: "/models/bed.glb",
                marker: "/markers/bed-target.mind"
            }
        };

        const productId = new URLSearchParams(window.location.search).get("product");
        const furniture = furnitureOptions[productId] || furnitureOptions.chair;

        const scene = document.getElementById("marker-scene");
        const model = document.getElementById("furniture-model");
        const status = document.getElementById("marker-status");

        document.title = `${furniture.name} - Marker AR`;

        scene.setAttribute(
            "mindar-image",
            // filterMinCF / filterBeta tune MindAR's built-in smoothing filter.
            // Lowering filterMinCF and raising filterBeta trades a little
            // responsiveness for noticeably less jitter on the tracked marker.
            // Some shake is inherent to marker tracking + hand tremor and
            // can't be removed completely, but this reduces it.
            `imageTargetSrc: ${furniture.marker}; autoStart: true; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0005; filterBeta: 1000;`
        );

        model.setAttribute("gltf-model", furniture.model);

        const MODEL_FIT_SIZE = 0.3;

        // ---------------------------------------------------------
        // Rotation state
        // ---------------------------------------------------------
        let modelReady = false;
        let autoRotateEnabled = true;
        let isDragging = false;
        let lastPointerX = 0;
        let resumeAutoRotateTimeoutId = null;

        const AUTO_ROTATE_SPEED = 0.6;        // radians per second
        const DRAG_ROTATE_SPEED = 0.012;      // radians per pixel of drag
        const AUTO_ROTATE_RESUME_DELAY = 1500; // ms of inactivity before auto-rotate resumes

        model.addEventListener("model-loaded", (event) => {
            const threeModel = event.detail.model;
            if (!threeModel) {
                status.textContent = `Unable to load the ${furniture.name.toLowerCase()} model.`;
                return;
            }

            const three = AFRAME.THREE;
            threeModel.updateMatrixWorld(true);

            const bounds = new three.Box3().setFromObject(threeModel);
            const size = bounds.getSize(new three.Vector3());
            const center = bounds.getCenter(new three.Vector3());

            const boundsAreValid =
                isFinite(size.x) && isFinite(size.y) && isFinite(size.z) &&
                !(size.x === 0 && size.y === 0 && size.z === 0);

            if (boundsAreValid) {
                const maxDimension = Math.max(size.x, size.y, size.z, 0.001);
                threeModel.position.sub(center);
                threeModel.scale.setScalar(MODEL_FIT_SIZE / maxDimension);
                model.setAttribute("position", "0 0 0");
            } else {
                model.setAttribute("scale", "1 1 1");
            }

            model.setAttribute("visible", "true");
            modelReady = true;

            status.textContent = `${furniture.name} ready. Drag to rotate.`;
        });

        model.addEventListener("model-error", () => {
            status.textContent = `Unable to load the ${furniture.name.toLowerCase()} model.`;
        });

        document.getElementById("furniture-target").addEventListener("targetFound", () => {
            status.textContent = modelReady ? `${furniture.name} detected. Drag to rotate.` : `${furniture.name} detected.`;
        });

        document.getElementById("furniture-target").addEventListener("targetLost", () => {
            status.textContent = "Point your camera at the furniture marker.";
        });

        // ---------------------------------------------------------
        // Auto-rotate animation loop
        // Spins the model around Y at a constant speed, unless the
        // user is currently dragging (or was dragging very recently).
        // ---------------------------------------------------------
        let lastFrameTime = performance.now();

        function animate(now) {
            const deltaSeconds = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            if (modelReady && autoRotateEnabled && !isDragging) {
                model.object3D.rotation.y += AUTO_ROTATE_SPEED * deltaSeconds;
            }

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ---------------------------------------------------------
        // Drag-to-rotate
        // Pointer events cover both touch and mouse. Dragging left/right
        // spins the model manually and immediately pauses auto-rotate;
        // auto-rotate resumes automatically a short while after the user
        // lets go, so the piece doesn't just sit frozen forever.
        // ---------------------------------------------------------
        function pauseAutoRotate() {
            autoRotateEnabled = false;
            if (resumeAutoRotateTimeoutId) {
                clearTimeout(resumeAutoRotateTimeoutId);
                resumeAutoRotateTimeoutId = null;
            }
        }

        function scheduleAutoRotateResume() {
            if (resumeAutoRotateTimeoutId) {
                clearTimeout(resumeAutoRotateTimeoutId);
            }
            resumeAutoRotateTimeoutId = setTimeout(() => {
                autoRotateEnabled = true;
                resumeAutoRotateTimeoutId = null;
            }, AUTO_ROTATE_RESUME_DELAY);
        }

        function onPointerDown(event) {
            if (!modelReady) return;
            isDragging = true;
            lastPointerX = event.clientX;
            pauseAutoRotate();
            event.target.setPointerCapture?.(event.pointerId);
        }

        function onPointerMove(event) {
            if (!isDragging) return;
            const deltaX = event.clientX - lastPointerX;
            lastPointerX = event.clientX;
            model.object3D.rotation.y += deltaX * DRAG_ROTATE_SPEED;
        }

        function onPointerUp() {
            if (!isDragging) return;
            isDragging = false;
            scheduleAutoRotateResume();
        }

        // The scene's canvas isn't guaranteed to exist until the scene has
        // loaded, so attach the drag listeners once it's ready.
        scene.addEventListener("loaded", () => {
            const canvas = scene.canvas;
            canvas.addEventListener("pointerdown", onPointerDown);
            canvas.addEventListener("pointermove", onPointerMove);
            canvas.addEventListener("pointerup", onPointerUp);
            canvas.addEventListener("pointercancel", onPointerUp);
            canvas.addEventListener("pointerleave", onPointerUp);
        });
    </script>

</body>
</html>
