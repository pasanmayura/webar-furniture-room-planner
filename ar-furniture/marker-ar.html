<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Furniture Marker AR</title>

        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

        <style>
            body {
                margin: 0;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            a-scene {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
            }

            canvas.a-canvas {
                width: 100% !important;
                height: 100% !important;
                touch-action: none;
            }

            #marker-status {
                position: fixed;
                z-index: 20;
                top: 1rem;
                left: 1rem;
                right: 9rem;
                margin: 0;
                padding: 0.75rem 1rem;
                color: #fff;
                background: rgba(35, 38, 31, 0.78);
                border-radius: 0.5rem;
                font: 500 0.95rem/1.4 Arial, sans-serif;
                text-align: center;
            }

        </style>
    </head>

    <body>
    <p id="marker-status">Point your camera at the furniture marker.</p>

        <a-scene
            id="marker-scene"
            embedded
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            color-space="sRGB"
            renderer="colorManagement: true; antialias: true"
            shadow="type: pcfsoft"
        >
            <a-entity id="furniture-target" mindar-image-target="targetIndex: 0">
                <a-gltf-model
                    id="furniture-model"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="1 1 1"
                    visible="false"
                    shadow="cast: true; receive: true"
                ></a-gltf-model>
            </a-entity>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        </a-scene>

        <script type="module" src="/src/marker-ar.js"></script>
    </body>
</html>
