<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Marker AR Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #marker-status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            padding: 10px 14px;
            border-radius: 6px;

            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<p id="marker-status">
    Starting camera...
</p>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    "
>

    <a-marker
        preset="hiro"
        id="hiro-marker"
        emitevents="true"
    >

        <a-box
            position="0 0.25 0"
            scale="0.5 0.5 0.5"
            material="color: red;"
        >
        </a-box>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

    const status = document.getElementById("marker-status");
    const marker = document.getElementById("hiro-marker");

    marker.addEventListener("markerFound", () => {

        console.log("MARKER FOUND");

        status.textContent =
            "Hiro marker detected";

    });

    marker.addEventListener("markerLost", () => {

        console.log("MARKER LOST");

        status.textContent =
            "Marker lost";

    });

</script>

</body>
</html>
