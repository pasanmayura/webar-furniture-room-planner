<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Furniture Marker AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        a-scene {
            width: 100vw;
            height: 100vh;
        }

        #marker-status {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 2;
            margin: 0;
            padding: 0.65rem 0.85rem;
            border-radius: 0.4rem;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font: 600 0.9rem/1.3 sans-serif;
        }
    </style>
</head>

<body>

    <p id="marker-status">Starting camera...</p>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    >

        <!-- Hiro marker -->
        <a-marker preset="hiro" emitevents="true">

            <!-- Test cube -->
            <a-box
                position="0 0.5 0"
                scale="1 1 1"
                color="#4CAF50"
            >
            </a-box>

        </a-marker>

        <!-- AR camera -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const markerStatus = document.getElementById("marker-status");
        const marker = document.querySelector("a-marker");

        document.querySelector("a-scene").addEventListener("loaded", () => {
            markerStatus.textContent = "Camera ready - point it at the Hiro marker";
        });
        marker.addEventListener("markerFound", () => {
            markerStatus.textContent = "Hiro marker detected";
        });
        marker.addEventListener("markerLost", () => {
            markerStatus.textContent = "Marker lost - point the camera at Hiro";
        });
    </script>

</body>
</html>
