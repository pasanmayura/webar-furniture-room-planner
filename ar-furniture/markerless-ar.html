<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Markerless Furniture AR</title>
  <link rel="stylesheet" href="/markerless-ar.css" />
</head>

<body>

  <div id="info"> Loading furniture model... </div>

  <button id="start-ar" disabled> Start AR </button>

  <button id="exit-ar" type="button"> Exit AR </button>

  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { XREstimatedLight } from 'three/examples/jsm/webxr/XREstimatedLight.js';

    let scene;
    let camera;
    let renderer;
    let controller;
    let reticle;
    let xrLight = null;
    let fallbackHemisphereLight = null;
    let fallbackDirectionalLight = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let activeSession = null;
    let localReferenceSpace = null;
    let footprintHitTestSources = [];
    let footprintHitTestSourcePromise = null;
    let footprintCenter = null;
    let footprintResults = [false, false, false, false, false];
    let planeDetectionAvailable = false;
    let furnitureTemplate = null;
    let canPlaceFurniture = false;
    const placedFurniture = [];
    let placementGuide;
    let selectedFurniture = null;
    let isDraggingFurniture = false;
    let dragStartPosition = null;
    let dragStartRotation = null;
    let dragStartControllerYaw = 0;
    let placementWasValid = false;
    let audioContext = null;
    const furnitureRaycaster = new THREE.Raycaster();
    const furnitureRay = new THREE.Vector3(0, 0, -1);

    const furnitureOptions = {
      chair: {
        name: 'chair',
        model: '/models/chair.glb'
      },
      table: {
        name: 'table',
        model: '/models/table.glb'
      },
      bed: {
        name: 'bed',
        model: '/models/bed.glb'
      }
    };

    const productId = new URLSearchParams(window.location.search).get('product');
    const selectedColor = new URLSearchParams(window.location.search).get('color');
    const furniture = furnitureOptions[productId] || furnitureOptions.chair;

    const furnitureSizes = {
      chair: { width: 0.60, depth: 0.65 },
      table: { width: 1.20, depth: 0.70 },
      bed: { width: 2.00, depth: 1.60 }
    };

    function getFurnitureSize() {
      return furnitureSizes[productId] || furnitureSizes.chair;
    }

    function playPlacementReadySound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      const startTime = audioContext.currentTime;

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(520, startTime);
      oscillator.frequency.exponentialRampToValueAtTime(780, startTime + 0.12);

      gainNode.gain.setValueAtTime(0.0001, startTime);
      gainNode.gain.exponentialRampToValueAtTime(0.16, startTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.28);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.start(startTime);
      oscillator.stop(startTime + 0.3);
    }

    function applySelectedColor(model) {
      if (!selectedColor || !/^#[0-9a-f]{6}$/i.test(selectedColor)) {
        return;
      }

      model.traverse((node) => {
        if (!node.isMesh || !node.material) {
          return;
        }

        const materials = Array.isArray(node.material)
          ? node.material
          : [node.material];

        materials.forEach((material) => {
          if (material.color) {
            material.color.set(selectedColor);
          }
        });
      });
    }

    const info = document.getElementById('info');
    const startButton = document.getElementById('start-ar');
    const exitButton = document.getElementById('exit-ar');

    init();

    function init() {

      createScene();
      createLights();
      createReticle();
      createController();
      loadFurnitureModel();
      setupEvents();

    }

    function createScene() {

      scene = new THREE.Scene();

      camera =
        new THREE.PerspectiveCamera(
          70,
          window.innerWidth /
            window.innerHeight,
          0.01,
          20
        );
  
      renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
      renderer.setPixelRatio(
        window.devicePixelRatio
      );
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Better color handling
      renderer.outputColorSpace =
        THREE.SRGBColorSpace;

      document.body.appendChild(
        renderer.domElement
      );
    }
 
    function createLights() {
      xrLight = new XREstimatedLight(renderer);
      xrLight.directionalLight.castShadow = true;
      xrLight.directionalLight.shadow.mapSize.set(2048, 2048);
      xrLight.directionalLight.shadow.camera.near = 0.1;
      xrLight.directionalLight.shadow.camera.far = 15;
      xrLight.directionalLight.shadow.camera.left = -3;
      xrLight.directionalLight.shadow.camera.right = 3;
      xrLight.directionalLight.shadow.camera.top = 3;
      xrLight.directionalLight.shadow.camera.bottom = -3;
      xrLight.directionalLight.shadow.bias = -0.001;
      xrLight.directionalLight.shadow.normalBias = 0.02;

      xrLight.addEventListener('estimationstart', () => {
        scene.add(xrLight);
        scene.remove(fallbackHemisphereLight);
        scene.remove(fallbackDirectionalLight);
        if (xrLight.environment) {
          scene.environment = xrLight.environment;
        }
      });

      xrLight.addEventListener('estimationend', () => {
        scene.remove(xrLight);
        scene.add(fallbackHemisphereLight);
        scene.add(fallbackDirectionalLight);
        scene.environment = null;
      });

      fallbackHemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
      fallbackDirectionalLight = new THREE.DirectionalLight(0xffffff, 2);
      fallbackDirectionalLight.position.set(1.5, 3.5, 2);
      fallbackDirectionalLight.castShadow = true;
      fallbackDirectionalLight.shadow.mapSize.set(2048, 2048);
      fallbackDirectionalLight.shadow.camera.near = 0.1;
      fallbackDirectionalLight.shadow.camera.far = 15;
      fallbackDirectionalLight.shadow.camera.left = -3;
      fallbackDirectionalLight.shadow.camera.right = 3;
      fallbackDirectionalLight.shadow.camera.top = 3;
      fallbackDirectionalLight.shadow.camera.bottom = -3;
      fallbackDirectionalLight.shadow.bias = -0.001;
      fallbackDirectionalLight.shadow.normalBias = 0.02;

      scene.add(fallbackHemisphereLight);
      scene.add(fallbackDirectionalLight);
    }

    function createSoftShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;

      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(128, 128, 8, 128, 128, 118);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0.42)');
      gradient.addColorStop(0.45, 'rgba(0, 0, 0, 0.20)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 256, 256);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function createFurnitureShadow(position, size) {
      const shadowGroup = new THREE.Group();
      const shadowCatcherSize = Math.max(size.width, size.depth, 0.2) * 2.4;
      const contactSize = Math.max(size.width, size.depth, 0.18) * 1.35;

      // 1. Dynamic Directional Shadow Receiver (ShadowMaterial)
      const shadowReceiverGeometry = new THREE.PlaneGeometry(shadowCatcherSize, shadowCatcherSize);
      const shadowReceiverMaterial = new THREE.ShadowMaterial({
        opacity: 0.42,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1
      });
      const shadowReceiver = new THREE.Mesh(shadowReceiverGeometry, shadowReceiverMaterial);
      shadowReceiver.receiveShadow = true;
      shadowReceiver.rotation.x = -Math.PI / 2;
      shadowReceiver.position.set(0, 0.001, 0);
      shadowReceiver.renderOrder = 1;
      shadowGroup.add(shadowReceiver);

      // 2. Soft Ambient Contact Shadow
      const contactGeometry = new THREE.PlaneGeometry(contactSize, contactSize);
      const contactMaterial = new THREE.MeshBasicMaterial({
        map: createSoftShadowTexture(),
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2
      });
      const contactMesh = new THREE.Mesh(contactGeometry, contactMaterial);
      contactMesh.rotation.x = -Math.PI / 2;
      contactMesh.position.set(0, 0.002, 0);
      contactMesh.renderOrder = 2;
      shadowGroup.add(contactMesh);

      shadowGroup.position.set(position.x, position.y, position.z);
      scene.add(shadowGroup);
      return shadowGroup;
    }

    function updateFurnitureShadow(item) {
      if (!item.shadow) {
        return;
      }

      item.shadow.position.set(
        item.object3D.position.x,
        item.object3D.position.y,
        item.object3D.position.z
      );
      item.shadow.rotation.y = item.object3D.rotation.y;
    }

    function createReticle() {

      const geometry = new THREE.RingGeometry(0.08, 0.1, 32);
      geometry.rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({color: 0x00ff00});
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;

      scene.add(reticle);
      updatePlacementGuide();

    }

    function updatePlacementGuide() {
      const { width, depth } = getFurnitureSize();
      const guideGeometry = new THREE.BufferGeometry();
      const halfWidth = width / 2;
      const halfDepth = depth / 2;
      const vertices = new Float32Array([
        -halfWidth, 0.01, -halfDepth, halfWidth, 0.01, -halfDepth,
        halfWidth, 0.01, -halfDepth, halfWidth, 0.01, halfDepth,
        halfWidth, 0.01, halfDepth, -halfWidth, 0.01, halfDepth,
        -halfWidth, 0.01, halfDepth, -halfWidth, 0.01, -halfDepth
      ]);

      guideGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      placementGuide = new THREE.LineSegments(guideGeometry, new THREE.LineBasicMaterial({ color: 0xff0000 }));
      placementGuide.matrixAutoUpdate = false;
      placementGuide.visible = false;
      scene.add(placementGuide);
    }

    function setPlacementFeedback(isValid, message) {
      const color = isValid ? 0x00ff00 : 0xff0000;
      reticle.material.color.set(color);
      placementGuide.material.color.set(color);
      if (isValid && !placementWasValid) {
        playPlacementReadySound();
      }
      placementWasValid = isValid;
      info.textContent = message;
    }

    function updatePlacementGuideTransform() {
      if (!placementGuide) {
        return;
      }
      placementGuide.matrix.copy(reticle.matrix);
      placementGuide.matrixAutoUpdate = false;
      placementGuide.visible = reticle.visible;
    }

    function getFootprintOffsets() {
      const { width, depth } = getFurnitureSize();
      const halfWidth = width * 0.45;
      const halfDepth = depth * 0.45;

      return [
        { x: -halfWidth, z: -halfDepth },
        { x: halfWidth, z: -halfDepth },
        { x: -halfWidth, z: halfDepth },
        { x: halfWidth, z: halfDepth },
        { x: 0, z: 0 }
      ];
    }

    async function createFootprintHitTestSources(center) {
      if (!localReferenceSpace || footprintHitTestSourcePromise) {
        return;
      }

      footprintCenter = center.clone();
      footprintHitTestSourcePromise = Promise.all(
        getFootprintOffsets().map((offset) => {
          const offsetSpace = localReferenceSpace.getOffsetReferenceSpace(
            new XRRigidTransform({
              x: center.x + offset.x,
              y: center.y + 0.05,
              z: center.z + offset.z
            })
          );
          return renderer.xr.getSession().requestHitTestSource({
            space: offsetSpace,
            offsetRay: new XRRay({ direction: { x: 0, y: -1, z: 0 } })
          });
        })
      ).then((sources) => {
        footprintHitTestSources = sources;
        footprintHitTestSourcePromise = null;
      }).catch(() => {
        footprintHitTestSources = [];
        footprintHitTestSourcePromise = null;
      });
    }

    function isPointInsidePlane(frame, plane, worldPoint) {
      const pose = frame.getPose(plane.planeSpace, localReferenceSpace);
      if (!pose || !plane.polygon || plane.polygon.length < 3) {
        return false;
      }

      const planeMatrix = new THREE.Matrix4().fromArray(pose.transform.matrix).invert();
      const planePoint = worldPoint.clone().applyMatrix4(planeMatrix);
      let inside = false;

      for (let index = 0, previous = plane.polygon.length - 1; index < plane.polygon.length; previous = index++) {
        const currentPoint = plane.polygon[index];
        const previousPoint = plane.polygon[previous];
        const intersects =
          (currentPoint.z > planePoint.z) !== (previousPoint.z > planePoint.z) &&
          planePoint.x <
            ((previousPoint.x - currentPoint.x) * (planePoint.z - currentPoint.z)) /
              (previousPoint.z - currentPoint.z) +
              currentPoint.x;

        if (intersects) {
          inside = !inside;
        }
      }

      return inside;
    }

    function checkDetectedPlaneSpace(frame, center) {
      if (!frame.detectedPlanes || !localReferenceSpace) {
        return null;
      }

      planeDetectionAvailable = true;
      const { width, depth } = getFurnitureSize();
      const halfWidth = width / 2;
      const halfDepth = depth / 2;
      const footprintPoints = [
        new THREE.Vector3(center.x - halfWidth, center.y, center.z - halfDepth),
        new THREE.Vector3(center.x + halfWidth, center.y, center.z - halfDepth),
        new THREE.Vector3(center.x - halfWidth, center.y, center.z + halfDepth),
        new THREE.Vector3(center.x + halfWidth, center.y, center.z + halfDepth)
      ];

      for (const plane of frame.detectedPlanes) {
        if (plane.orientation !== 'horizontal') {
          continue;
        }

        const planePose = frame.getPose(plane.planeSpace, localReferenceSpace);
        if (!planePose || Math.abs(planePose.transform.position.y - center.y) > 0.12) {
          continue;
        }

        if (footprintPoints.every((point) => isPointInsidePlane(frame, plane, point))) {
          return true;
        }
      }

      return false;
    }

    function checkAvailableFloorSpace(frame, center) {
      const detectedPlaneResult = checkDetectedPlaneSpace(frame, center);
      if (detectedPlaneResult !== null) {
        return detectedPlaneResult;
      }

      if (footprintHitTestSources.length !== 5) {
        return false;
      }

      footprintResults = footprintHitTestSources.map((source) => {
        return frame.getHitTestResults(source).length > 0;
      });

      const centerIsValid = footprintResults[4];
      const validCorners = footprintResults.slice(0, 4).filter(Boolean).length;

      return centerIsValid && validCorners === 4;
    }

    function createFurnitureBoundingBox(position, size) {
      const halfWidth = size.width / 2;
      const halfDepth = size.depth / 2;

      return new THREE.Box3(
        new THREE.Vector3(position.x - halfWidth, position.y - 0.05, position.z - halfDepth),
        new THREE.Vector3(position.x + halfWidth, position.y + 0.3, position.z + halfDepth)
      );
    }

    function checkVirtualFurnitureCollision(position) {
      return checkVirtualFurnitureCollisionExcept(position, null);
    }

    function checkVirtualFurnitureCollisionExcept(position, ignoredItem) {
      const proposedBox = createFurnitureBoundingBox(position, getFurnitureSize());

      return placedFurniture.some((item) => {
        if (item === ignoredItem) {
          return false;
        }
        return proposedBox.intersectsBox(item.boundingBox);
      });
    }

    function validatePlacement(position, hasEnoughFloor, ignoredItem = null) {
      const overlapsExistingFurniture = checkVirtualFurnitureCollisionExcept(position, ignoredItem);

      canPlaceFurniture = hasEnoughFloor && !overlapsExistingFurniture;

      if (overlapsExistingFurniture) {
        setPlacementFeedback(false, 'Furniture overlaps an existing item');
      } else if (hasEnoughFloor) {
        setPlacementFeedback(true, 'Enough space - tap to place');
      } else {
        setPlacementFeedback(false, 'Not enough space for this furniture');
      }
      return canPlaceFurniture;
    }

    function findPlacedFurniture(intersectionObject) {
      let currentObject = intersectionObject;
      while (currentObject) {
        const item = placedFurniture.find((placedItem) => placedItem.object3D === currentObject);
        if (item) {
          return item;
        }
        currentObject = currentObject.parent;
      }
      return null;
    }

    function selectPlacedFurniture() {
      scene.updateMatrixWorld(true);
      furnitureRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      furnitureRaycaster.ray.direction
        .copy(furnitureRay)
        .transformDirection(controller.matrixWorld);

      const intersections = furnitureRaycaster.intersectObjects(
        placedFurniture.map((item) => item.object3D),
        true
      );

      return intersections.length > 0
        ? findPlacedFurniture(intersections[0].object)
        : null;
    }

    function startFurnitureDrag() {
      selectedFurniture = selectPlacedFurniture();
      if (!selectedFurniture) {
        return;
      }

      isDraggingFurniture = true;
      dragStartPosition = selectedFurniture.object3D.position.clone();
      dragStartRotation = selectedFurniture.object3D.rotation.clone();
      const controllerEuler = new THREE.Euler().setFromQuaternion(
        controller.getWorldQuaternion(new THREE.Quaternion()),
        'YXZ'
      );
      dragStartControllerYaw = controllerEuler.y;
      info.textContent = `Drag to move ${furniture.name}; rotate your finger to turn it`;
    }

    function finishFurnitureDrag() {
      if (!isDraggingFurniture || !selectedFurniture) {
        return false;
      }

      if (!canPlaceFurniture) {
        selectedFurniture.object3D.position.copy(dragStartPosition);
        selectedFurniture.object3D.rotation.copy(dragStartRotation);
        updateFurnitureBoundingBox(selectedFurniture);
        info.textContent = 'Not enough space for this furniture';
      } else {
        info.textContent = `${furniture.name} moved successfully`;
      }

      isDraggingFurniture = false;
      selectedFurniture = null;
      dragStartPosition = null;
      dragStartRotation = null;
      dragStartControllerYaw = 0;
      return true;
    }

    function updateFurnitureBoundingBox(item) {
      item.boundingBox = createFurnitureBoundingBox(item.object3D.position, getFurnitureSize());
    }

    function createController() {

      controller =
        renderer.xr.getController(0);

      controller.addEventListener(
        'selectstart',
        startFurnitureDrag
      );
      controller.addEventListener(
        'selectend',
        () => {
          if (!finishFurnitureDrag()) {
            placeNewFurniture();
          }
        }
      );
      scene.add(
        controller
      );
    }

    function loadFurnitureModel() {

      const loader =
        new GLTFLoader();

      loader.load(
        furniture.model,

        function (gltf) {

          furnitureTemplate = gltf.scene;
          applySelectedColor(furnitureTemplate);
          furnitureTemplate.scale.set(0.5, 0.5, 0.5);
          console.log(`${furniture.name} loaded successfully`);
          info.textContent = `${furniture.name} ready - press Start AR`;
          startButton.disabled = false;
        },
 
        function (xhr) {

          if (xhr.total) {
            const percent = Math.round(xhr.loaded / xhr.total * 100);
            info.textContent = `Loading ${furniture.name}: ${percent}%`;}
        },

        function (error) {

          console.error(
            `${furniture.name} loading error:`,
            error
          );

          info.textContent = `Failed to load ${furniture.name} model`;
        }
      );
    }

    function setupEvents() {

      startButton.addEventListener('click', startAR);
      exitButton.addEventListener('click', exitAR);
      window.addEventListener('resize', onWindowResize);
    }
  
    async function startAR() {

      if (!navigator.xr) {
        info.textContent = 'WebXR is not supported on this device/browser.';
        return;
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioContext = audioContext || new AudioContextClass();
        audioContext.resume();
      }

      try {
        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );

        if (!supported) {
          info.textContent =
            'Markerless AR is not supported on this device.';
          return;
        }

        const session =
          await navigator.xr.requestSession(
            'immersive-ar',
            {
              requiredFeatures: [
                'hit-test'
              ],
              optionalFeatures: [
                'dom-overlay',
                'plane-detection',
                'light-estimation'
              ],
              domOverlay: {
                root: document.body
              }

            }
          );

        activeSession = session;

        renderer.xr.setReferenceSpaceType(
          'local'
        );

        localReferenceSpace = await session.requestReferenceSpace('local');

        await renderer.xr.setSession(
          session
        );

        startButton.style.display = 'none';
        exitButton.style.display = 'block';
        info.textContent = 'Move your phone slowly to find a surface';

        renderer.setAnimationLoop(render);

        session.addEventListener(
          'end',
          function () {

            renderer.setAnimationLoop(null);
            hitTestSource = null;
            hitTestSourceRequested = false;
            footprintHitTestSources.forEach((source) => source.cancel());
            footprintHitTestSources = [];
            footprintHitTestSourcePromise = null;
            footprintCenter = null;
            localReferenceSpace = null;
            activeSession = null;
            planeDetectionAvailable = false;
            canPlaceFurniture = false;
            placementWasValid = false;
            isDraggingFurniture = false;
            selectedFurniture = null;
            reticle.visible = false;
            placementGuide.visible = false;

            placedFurniture.forEach((item) => {
              if (item.object3D) {
                scene.remove(item.object3D);
              }
              if (item.shadow) {
                scene.remove(item.shadow);
              }
            });
            placedFurniture.length = 0;

            startButton.style.display = 'block';
            exitButton.style.display = 'none';
            info.textContent = 'AR session ended';
          }
        );
      }
      catch (error) {

        activeSession = null;
        exitButton.style.display = 'none';
        console.error('AR session error:', error);
        info.textContent = 'Could not start AR session.';
      }
    }

    function exitAR() {
      if (activeSession) {
        activeSession.end();
      }
    }

    function placeNewFurniture() {

      if (!reticle.visible) {

        info.textContent = 'No surface found yet';
        return;
      }

      if (!canPlaceFurniture) {

        info.textContent = 'Not enough space for this furniture';
        return;
      }

      if (!furnitureTemplate) {

        info.textContent = `${furniture.name} is still loading`;
        return;
      }

      const placedObject = furnitureTemplate.clone(true);
      placedObject.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
      const position = new THREE.Vector3();
      position.setFromMatrixPosition(reticle.matrix);
      placedObject.position.copy(position);
      placedObject.position.y += 0.01;
      placedObject.scale.set( 0.5, 0.5, 0.5);

      scene.add(placedObject);

      const size = getFurnitureSize();
      const shadow = createFurnitureShadow(placedObject.position, size);

      const placedItem = {
        type: furniture.name,
        object3D: placedObject,
        width: size.width,
        depth: size.depth,
        shadow,
        boundingBox: createFurnitureBoundingBox(placedObject.position, size)
      };
      placedFurniture.push(placedItem);
      updateFurnitureBoundingBox(placedItem);

      console.log(`${furniture.name} placed:`, placedObject.position);
      info.textContent = `${furniture.name} placed successfully`;
    }

    function render(timestamp, frame) {

      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {

          session
            .requestReferenceSpace('viewer')
            .then(function (viewerReferenceSpace) {
                session
                  .requestHitTestSource({space:viewerReferenceSpace})
                  .then(function (source) {
                      hitTestSource = source;
                    }
                  );
              }
            );

          hitTestSourceRequested = true;
        }
  
        if (hitTestSource) {

          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {

            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            if (pose) {
              reticle.visible = true;

              reticle.matrix.fromArray(pose.transform.matrix);

              const placementPosition = new THREE.Vector3();
              placementPosition.setFromMatrixPosition(reticle.matrix);
              if ( !footprintCenter || footprintCenter.distanceTo(placementPosition) > 0.15 ) {
                footprintHitTestSources.forEach((source) => source.cancel());
                footprintHitTestSources = [];
                footprintResults = [false, false, false, false, false];
                createFootprintHitTestSources(placementPosition);
              }
              updatePlacementGuideTransform();
              const hasEnoughFloor = checkAvailableFloorSpace(frame, placementPosition);
              if (isDraggingFurniture && selectedFurniture) {
                selectedFurniture.object3D.position.copy(placementPosition);
                selectedFurniture.object3D.position.y += 0.01;

                const controllerEuler = new THREE.Euler().setFromQuaternion(
                  controller.getWorldQuaternion(new THREE.Quaternion()),
                  'YXZ'
                );
                const controllerRotationChange = controllerEuler.y - dragStartControllerYaw;
                selectedFurniture.object3D.rotation.y = dragStartRotation.y + controllerRotationChange;
                updateFurnitureShadow(selectedFurniture);
                updateFurnitureBoundingBox(selectedFurniture);
                validatePlacement(placementPosition, hasEnoughFloor, selectedFurniture);
              } else {
                validatePlacement(placementPosition, hasEnoughFloor);
              }
            }
          }
          else {

            reticle.visible = false;
            canPlaceFurniture = false;
            placementWasValid = false;

            if (placementGuide) {
              placementGuide.visible = false;
            }

            info.textContent = 'Move your phone slowly to find a surface';
          }
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

  </script>
