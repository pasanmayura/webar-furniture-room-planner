<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>Markerless Furniture AR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 15px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 14px;
    }

    #start-ar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      padding: 14px 24px;

      border: none;
      border-radius: 8px;

      background: #ffffff;
      color: #111;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="info">
    Press Start AR
  </div>

  <button id="start-ar">
    Start AR
  </button>

  <script type="module">

    import * as THREE from 'three';

    let scene;
    let camera;
    let renderer;

    let controller;

    let reticle;

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    init();

    function init() {

      // -----------------------------
      // Scene
      // -----------------------------

      scene = new THREE.Scene();

      // -----------------------------
      // Camera
      // -----------------------------

      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );

      // -----------------------------
      // Renderer
      // -----------------------------

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;

      document.body.appendChild(renderer.domElement);

      // -----------------------------
      // Lighting
      // -----------------------------

      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        2
      );

      scene.add(light);

      // -----------------------------
      // Placement Reticle
      // -----------------------------

      const ringGeometry =
        new THREE.RingGeometry(
          0.08,
          0.1,
          32
        );

      ringGeometry.rotateX(
        -Math.PI / 2
      );

      const ringMaterial =
        new THREE.MeshBasicMaterial({
          color: 0x00ff00
        });

      reticle = new THREE.Mesh(
        ringGeometry,
        ringMaterial
      );

      reticle.matrixAutoUpdate = false;

      reticle.visible = false;

      scene.add(reticle);

      // -----------------------------
      // Controller / screen tap
      // -----------------------------

      controller =
        renderer.xr.getController(0);

      controller.addEventListener(
        'select',
        onSelect
      );

      scene.add(controller);

      // -----------------------------
      // Start AR button
      // -----------------------------

      document
        .getElementById('start-ar')
        .addEventListener(
          'click',
          startAR
        );

      // -----------------------------
      // Resize
      // -----------------------------

      window.addEventListener(
        'resize',
        onWindowResize
      );
    }


    // ==================================================
    // START AR
    // ==================================================

    async function startAR() {

      const info =
        document.getElementById('info');

      if (!navigator.xr) {

        info.textContent =
          'WebXR is not supported on this device/browser.';

        return;
      }

      try {

        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );

        if (!supported) {

          info.textContent =
            'Markerless AR is not supported on this device.';

          return;
        }

        const session =
          await navigator.xr.requestSession(
            'immersive-ar',
            {
              requiredFeatures: [
                'hit-test'
              ],
              optionalFeatures: [
                'dom-overlay'
              ],
              domOverlay: {
                root: document.body
              }
            }
          );

        renderer.xr.setReferenceSpaceType(
          'local'
        );

        await renderer.xr.setSession(
          session
        );

        document
          .getElementById('start-ar')
          .style.display = 'none';

        info.textContent =
          'Move your phone slowly to find a surface';

        renderer.setAnimationLoop(
          render
        );

      } catch (error) {

        console.error(error);

        info.textContent =
          'Could not start AR session.';
      }
    }


    // ==================================================
    // PLACE OBJECT
    // ==================================================

    function onSelect() {

      if (!reticle.visible) {
        return;
      }

      // Create test cube
      const geometry =
        new THREE.BoxGeometry(
          0.2,
          0.2,
          0.2
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x3366ff
        });

      const cube =
        new THREE.Mesh(
          geometry,
          material
        );

      // Position cube using reticle
      cube.position.setFromMatrixPosition(
        reticle.matrix
      );

      // Raise cube so it sits on surface
      cube.position.y += 0.1;

      scene.add(cube);

      document
        .getElementById('info')
        .textContent =
        'Cube placed successfully';
    }


    // ==================================================
    // RENDER LOOP
    // ==================================================

    function render(
      timestamp,
      frame
    ) {

      if (frame) {

        const referenceSpace =
          renderer.xr.getReferenceSpace();

        const session =
          renderer.xr.getSession();

        // Request hit test source once
        if (
          hitTestSourceRequested === false
        ) {

          session
            .requestReferenceSpace(
              'viewer'
            )
            .then(
              function (
                referenceSpaceViewer
              ) {

                session
                  .requestHitTestSource({
                    space:
                      referenceSpaceViewer
                  })
                  .then(
                    function (source) {

                      hitTestSource =
                        source;

                    }
                  );

              }
            );

          session.addEventListener(
            'end',
            function () {

              hitTestSourceRequested =
                false;

              hitTestSource =
                null;

            }
          );

          hitTestSourceRequested =
            true;
        }

        // Check hit test
        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );

          if (
            hitTestResults.length
          ) {

            const hit =
              hitTestResults[0];

            const pose =
              hit.getPose(
                referenceSpace
              );

            reticle.visible =
              true;

            reticle.matrix.fromArray(
              pose.transform.matrix
            );

            document
              .getElementById('info')
              .textContent =
              'Surface found - tap to place cube';

          } else {

            reticle.visible =
              false;

          }

        }

      }

      renderer.render(
        scene,
        camera
      );
    }


    // ==================================================
    // RESIZE
    // ==================================================

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

  </script>

</body>
</html>
