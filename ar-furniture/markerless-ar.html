<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>Markerless Furniture AR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 15px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 14px;

      min-width: 220px;
    }

    #start-ar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      padding: 14px 24px;

      border: none;
      border-radius: 8px;

      background: #ffffff;
      color: #111;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #start-ar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div id="info">
    Loading chair model...
  </div>

  <button id="start-ar" disabled>
    Start AR
  </button>

  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader }
      from 'three/examples/jsm/loaders/GLTFLoader.js';


    // ==================================================
    // GLOBAL VARIABLES
    // ==================================================

    let scene;
    let camera;
    let renderer;

    let controller;

    let reticle;

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let chairTemplate = null;

    const info =
      document.getElementById('info');

    const startButton =
      document.getElementById('start-ar');


    // ==================================================
    // INITIALIZE
    // ==================================================

    init();


    function init() {

      createScene();

      createLights();

      createReticle();

      createController();

      loadChairModel();

      setupEvents();

    }


    // ==================================================
    // CREATE THREE.JS SCENE
    // ==================================================

    function createScene() {

      scene = new THREE.Scene();


      // -----------------------------
      // Camera
      // -----------------------------

      camera =
        new THREE.PerspectiveCamera(
          70,
          window.innerWidth /
            window.innerHeight,
          0.01,
          20
        );


      // -----------------------------
      // Renderer
      // -----------------------------

      renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });

      renderer.setPixelRatio(
        window.devicePixelRatio
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;


      // Better color handling
      renderer.outputColorSpace =
        THREE.SRGBColorSpace;


      document.body.appendChild(
        renderer.domElement
      );

    }


    // ==================================================
    // LIGHTING
    // ==================================================

    function createLights() {

      const hemisphereLight =
        new THREE.HemisphereLight(
          0xffffff,
          0x444444,
          2
        );

      scene.add(
        hemisphereLight
      );


      const directionalLight =
        new THREE.DirectionalLight(
          0xffffff,
          2
        );

      directionalLight.position.set(
        1,
        3,
        2
      );

      scene.add(
        directionalLight
      );

    }


    // ==================================================
    // PLACEMENT RETICLE
    // ==================================================

    function createReticle() {

      const geometry =
        new THREE.RingGeometry(
          0.08,
          0.1,
          32
        );


      // Make the ring lie flat
      geometry.rotateX(
        -Math.PI / 2
      );


      const material =
        new THREE.MeshBasicMaterial({
          color: 0x00ff00
        });


      reticle =
        new THREE.Mesh(
          geometry,
          material
        );


      reticle.matrixAutoUpdate =
        false;


      reticle.visible =
        false;


      scene.add(
        reticle
      );

    }


    // ==================================================
    // CONTROLLER
    // ==================================================

    function createController() {

      controller =
        renderer.xr.getController(0);


      controller.addEventListener(
        'select',
        onSelect
      );


      scene.add(
        controller
      );

    }


    // ==================================================
    // LOAD CHAIR
    // ==================================================

    function loadChairModel() {

      const loader =
        new GLTFLoader();


      loader.load(

        '/models/chair.glb',


        // -----------------------------
        // Success
        // -----------------------------

        function (gltf) {

          chairTemplate =
            gltf.scene;


          /*
            IMPORTANT:

            You may need to change this
            depending on your chair model.

            Try:
            1
            0.5
            0.1
            0.01
          */

          chairTemplate.scale.set(
            0.5,
            0.5,
            0.5
          );


          /*
            If your chair is facing
            the wrong direction,
            change rotation here.

            Example:

            chairTemplate.rotation.y =
              Math.PI;

          */


          console.log(
            'Chair loaded successfully'
          );


          info.textContent =
            'Chair ready - press Start AR';


          startButton.disabled =
            false;

        },


        // -----------------------------
        // Progress
        // -----------------------------

        function (xhr) {

          if (xhr.total) {

            const percent =
              Math.round(
                xhr.loaded /
                xhr.total *
                100
              );


            info.textContent =
              `Loading chair: ${percent}%`;

          }

        },


        // -----------------------------
        // Error
        // -----------------------------

        function (error) {

          console.error(
            'Chair loading error:',
            error
          );


          info.textContent =
            'Failed to load chair model';

        }

      );

    }


    // ==================================================
    // EVENTS
    // ==================================================

    function setupEvents() {

      startButton.addEventListener(
        'click',
        startAR
      );


      window.addEventListener(
        'resize',
        onWindowResize
      );

    }


    // ==================================================
    // START AR
    // ==================================================

    async function startAR() {

      if (!navigator.xr) {

        info.textContent =
          'WebXR is not supported on this device/browser.';

        return;
      }


      try {

        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );


        if (!supported) {

          info.textContent =
            'Markerless AR is not supported on this device.';

          return;
        }


        const session =
          await navigator.xr.requestSession(
            'immersive-ar',
            {

              requiredFeatures: [
                'hit-test'
              ],

              optionalFeatures: [
                'dom-overlay'
              ],

              domOverlay: {
                root: document.body
              }

            }
          );


        renderer.xr.setReferenceSpaceType(
          'local'
        );


        await renderer.xr.setSession(
          session
        );


        startButton.style.display =
          'none';


        info.textContent =
          'Move your phone slowly to find a surface';


        renderer.setAnimationLoop(
          render
        );


        session.addEventListener(
          'end',
          function () {

            hitTestSource =
              null;

            hitTestSourceRequested =
              false;


            startButton.style.display =
              'block';


            info.textContent =
              'AR session ended';

          }
        );

      }
      catch (error) {

        console.error(
          'AR session error:',
          error
        );


        info.textContent =
          'Could not start AR session.';

      }

    }


    // ==================================================
    // PLACE CHAIR
    // ==================================================

    function onSelect() {

      if (!reticle.visible) {

        info.textContent =
          'No surface found yet';

        return;
      }


      if (!chairTemplate) {

        info.textContent =
          'Chair is still loading';

        return;
      }


      // Clone the loaded model
      const chair =
        chairTemplate.clone(true);


      // -----------------------------
      // Get reticle position
      // -----------------------------

      const position =
        new THREE.Vector3();


      position.setFromMatrixPosition(
        reticle.matrix
      );


      chair.position.copy(
        position
      );


      /*
        If the model appears partly
        under the floor, increase this.

        Example:
        0.01
        0.05
        0.1
      */

      chair.position.y +=
        0.01;


      /*
        Scale may need adjusting.

        If chair is huge:
        0.1 or 0.01

        If chair is tiny:
        1 or 2
      */

      chair.scale.set(
        0.5,
        0.5,
        0.5
      );


      scene.add(
        chair
      );


      console.log(
        'Chair placed:',
        chair.position
      );


      info.textContent =
        'Chair placed successfully';

    }


    // ==================================================
    // HIT TEST / RENDER LOOP
    // ==================================================

    function render(
      timestamp,
      frame
    ) {

      if (frame) {

        const referenceSpace =
          renderer.xr.getReferenceSpace();


        const session =
          renderer.xr.getSession();


        // -----------------------------
        // Request hit test source
        // -----------------------------

        if (
          hitTestSourceRequested ===
          false
        ) {

          session
            .requestReferenceSpace(
              'viewer'
            )
            .then(
              function (
                viewerReferenceSpace
              ) {

                session
                  .requestHitTestSource({
                    space:
                      viewerReferenceSpace
                  })
                  .then(
                    function (source) {

                      hitTestSource =
                        source;

                    }
                  );

              }
            );


          hitTestSourceRequested =
            true;

        }

        // -----------------------------
        // Hit test
        // -----------------------------

        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length >
            0
          ) {

            const hit =
              hitTestResults[0];


            const pose =
              hit.getPose(
                referenceSpace
              );


            if (pose) {

              reticle.visible =
                true;


              reticle.matrix.fromArray(
                pose.transform.matrix
              );


              info.textContent =
                'Surface found - tap to place chair';

            }

          }
          else {

            reticle.visible =
              false;


            info.textContent =
              'Move your phone slowly to find a surface';

          }

        }

      }

      renderer.render(
        scene,
        camera
      );

    }


    // ==================================================
    // RESIZE
    // ==================================================

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }

  </script>

</body>
</html>
