<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>Markerless Furniture AR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 15px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 14px;

      min-width: 220px;
    }

    #start-ar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      padding: 14px 24px;

      border: none;
      border-radius: 8px;

      background: #ffffff;
      color: #111;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #start-ar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div id="info">
    Loading furniture model...
  </div>

  <button id="start-ar" disabled>
    Start AR
  </button>

  <script type="module">

    import * as THREE from 'three';

    import { GLTFLoader }
      from 'three/examples/jsm/loaders/GLTFLoader.js';

    let scene;
    let camera;
    let renderer;

    let controller;

    let reticle;

    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let localReferenceSpace = null;
    let footprintHitTestSources = [];
    let footprintHitTestSourcePromise = null;
    let footprintCenter = null;
    let footprintResults = [false, false, false, false, false];
    let planeDetectionAvailable = false;

    let furnitureTemplate = null;
    let canPlaceFurniture = false;
    const placedFurniture = [];
    let placementGuide;

    const furnitureOptions = {
      chair: {
        name: 'chair',
        model: '/models/chair.glb'
      },
      table: {
        name: 'table',
        model: '/models/table.glb'
      },
      bed: {
        name: 'bed',
        model: '/models/bed.glb'
      }
    };

    const productId = new URLSearchParams(window.location.search).get('product');
    const furniture = furnitureOptions[productId] || furnitureOptions.chair;

    const furnitureSizes = {
      chair: { width: 0.60, depth: 0.65 },
      table: { width: 1.20, depth: 0.70 },
      bed: { width: 2.00, depth: 1.60 }
    };

    function getFurnitureSize() {
      return furnitureSizes[productId] || furnitureSizes.chair;
    }

    const info =
      document.getElementById('info');

    const startButton =
      document.getElementById('start-ar');

    init();

    function init() {

      createScene();
      createLights();
      createReticle();
      createController();
      loadFurnitureModel();
      setupEvents();

    }

    // CREATE THREE.JS SCENE

    function createScene() {

      scene = new THREE.Scene();

      // Camera

      camera =
        new THREE.PerspectiveCamera(
          70,
          window.innerWidth /
            window.innerHeight,
          0.01,
          20
        );

      // Renderer
  
      renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });
      renderer.setPixelRatio(
        window.devicePixelRatio
      );
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;

      // Better color handling
      renderer.outputColorSpace =
        THREE.SRGBColorSpace;

      document.body.appendChild(
        renderer.domElement
      );
    }

    // LIGHTING
 
    function createLights() {

      const hemisphereLight =
        new THREE.HemisphereLight(
          0xffffff,
          0x444444,
          2
        );

      scene.add(
        hemisphereLight
      );

      const directionalLight =
        new THREE.DirectionalLight(
          0xffffff,
          2
        );

      directionalLight.position.set(
        1,
        3,
        2
      );
      scene.add(
        directionalLight
      );
    }

    // PLACEMENT RETICLE

    function createReticle() {

      const geometry =
        new THREE.RingGeometry(
          0.08,
          0.1,
          32
        );

      // Make the ring lie flat
      geometry.rotateX(
        -Math.PI / 2
      );

      const material =
        new THREE.MeshBasicMaterial({
          color: 0x00ff00
        });

      reticle =
        new THREE.Mesh(
          geometry,
          material
        );

      reticle.matrixAutoUpdate =
        false;

      reticle.visible =
        false;

      scene.add(
        reticle
      );
      updatePlacementGuide();

    }

    function updatePlacementGuide() {
      const { width, depth } = getFurnitureSize();
      const guideGeometry = new THREE.BufferGeometry();
      const halfWidth = width / 2;
      const halfDepth = depth / 2;
      const vertices = new Float32Array([
        -halfWidth, 0.01, -halfDepth, halfWidth, 0.01, -halfDepth,
        halfWidth, 0.01, -halfDepth, halfWidth, 0.01, halfDepth,
        halfWidth, 0.01, halfDepth, -halfWidth, 0.01, halfDepth,
        -halfWidth, 0.01, halfDepth, -halfWidth, 0.01, -halfDepth
      ]);

      guideGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(vertices, 3)
      );
      placementGuide = new THREE.LineSegments(
        guideGeometry,
        new THREE.LineBasicMaterial({ color: 0xff0000 })
      );
      placementGuide.matrixAutoUpdate = false;
      placementGuide.visible = false;
      scene.add(placementGuide);
    }

    function setPlacementFeedback(isValid, message) {
      const color = isValid ? 0x00ff00 : 0xff0000;
      reticle.material.color.set(color);
      placementGuide.material.color.set(color);
      info.textContent = message;
    }

    function updatePlacementGuideTransform() {
      if (!placementGuide) {
        return;
      }
      placementGuide.matrix.copy(reticle.matrix);
      placementGuide.matrixAutoUpdate = false;
      placementGuide.visible = reticle.visible;
    }

    function getFootprintOffsets() {
      const { width, depth } = getFurnitureSize();
      // Stay slightly inside the furniture edges because floor tracking is
      // less reliable exactly at the boundary of a detected surface.
      const halfWidth = width * 0.45;
      const halfDepth = depth * 0.45;

      return [
        { x: -halfWidth, z: -halfDepth },
        { x: halfWidth, z: -halfDepth },
        { x: -halfWidth, z: halfDepth },
        { x: halfWidth, z: halfDepth },
        { x: 0, z: 0 }
      ];
    }

    async function createFootprintHitTestSources(center) {
      if (!localReferenceSpace || footprintHitTestSourcePromise) {
        return;
      }

      footprintCenter = center.clone();
      footprintHitTestSourcePromise = Promise.all(
        getFootprintOffsets().map((offset) => {
          const offsetSpace = localReferenceSpace.getOffsetReferenceSpace(
            new XRRigidTransform({
              x: center.x + offset.x,
              y: center.y + 0.05,
              z: center.z + offset.z
            })
          );
          return renderer.xr.getSession().requestHitTestSource({
            space: offsetSpace,
            offsetRay: new XRRay({ direction: { x: 0, y: -1, z: 0 } })
          });
        })
      ).then((sources) => {
        footprintHitTestSources = sources;
        footprintHitTestSourcePromise = null;
      }).catch(() => {
        footprintHitTestSources = [];
        footprintHitTestSourcePromise = null;
      });
    }

    function isPointInsidePlane(frame, plane, worldPoint) {
      const pose = frame.getPose(plane.planeSpace, localReferenceSpace);
      if (!pose || !plane.polygon || plane.polygon.length < 3) {
        return false;
      }

      const planeMatrix = new THREE.Matrix4().fromArray(pose.transform.matrix).invert();
      const planePoint = worldPoint.clone().applyMatrix4(planeMatrix);
      let inside = false;

      for (let index = 0, previous = plane.polygon.length - 1; index < plane.polygon.length; previous = index++) {
        const currentPoint = plane.polygon[index];
        const previousPoint = plane.polygon[previous];
        const intersects =
          (currentPoint.z > planePoint.z) !== (previousPoint.z > planePoint.z) &&
          planePoint.x <
            ((previousPoint.x - currentPoint.x) * (planePoint.z - currentPoint.z)) /
              (previousPoint.z - currentPoint.z) +
              currentPoint.x;

        if (intersects) {
          inside = !inside;
        }
      }

      return inside;
    }

    function checkDetectedPlaneSpace(frame, center) {
      if (!frame.detectedPlanes || !localReferenceSpace) {
        return null;
      }

      planeDetectionAvailable = true;
      const { width, depth } = getFurnitureSize();
      const halfWidth = width / 2;
      const halfDepth = depth / 2;
      const footprintPoints = [
        new THREE.Vector3(center.x - halfWidth, center.y, center.z - halfDepth),
        new THREE.Vector3(center.x + halfWidth, center.y, center.z - halfDepth),
        new THREE.Vector3(center.x - halfWidth, center.y, center.z + halfDepth),
        new THREE.Vector3(center.x + halfWidth, center.y, center.z + halfDepth)
      ];

      for (const plane of frame.detectedPlanes) {
        if (plane.orientation !== 'horizontal') {
          continue;
        }

        const planePose = frame.getPose(plane.planeSpace, localReferenceSpace);
        if (!planePose || Math.abs(planePose.transform.position.y - center.y) > 0.12) {
          continue;
        }

        if (footprintPoints.every((point) => isPointInsidePlane(frame, plane, point))) {
          return true;
        }
      }

      return false;
    }

    function checkAvailableFloorSpace(frame, center) {
      const detectedPlaneResult = checkDetectedPlaneSpace(frame, center);
      if (detectedPlaneResult !== null) {
        return detectedPlaneResult;
      }

      if (footprintHitTestSources.length !== 5) {
        return false;
      }

      footprintResults = footprintHitTestSources.map((source) => {
        return frame.getHitTestResults(source).length > 0;
      });

      const centerIsValid = footprintResults[4];
      const validCorners = footprintResults.slice(0, 4).filter(Boolean).length;

      return centerIsValid && validCorners === 4;
    }

    function createFurnitureBoundingBox(position, size) {
      const halfWidth = size.width / 2;
      const halfDepth = size.depth / 2;

      return new THREE.Box3(
        new THREE.Vector3(position.x - halfWidth, position.y - 0.05, position.z - halfDepth),
        new THREE.Vector3(position.x + halfWidth, position.y + 0.3, position.z + halfDepth)
      );
    }

    function checkVirtualFurnitureCollision(position) {
      const proposedBox = createFurnitureBoundingBox(position, getFurnitureSize());

      return placedFurniture.some((item) => {
        return proposedBox.intersectsBox(item.boundingBox);
      });
    }

    function validatePlacement(position, hasEnoughFloor) {
      const overlapsExistingFurniture = checkVirtualFurnitureCollision(position);

      canPlaceFurniture = hasEnoughFloor && !overlapsExistingFurniture;

      if (overlapsExistingFurniture) {
        setPlacementFeedback(false, 'Furniture overlaps an existing item');
      } else if (hasEnoughFloor) {
        setPlacementFeedback(true, 'Enough space - tap to place');
      } else {
        setPlacementFeedback(false, 'Not enough space for this furniture');
      }
      return canPlaceFurniture;
    }

    // CONTROLLER
    function createController() {

      controller =
        renderer.xr.getController(0);

      controller.addEventListener(
        'select',
        onSelect
      );
      scene.add(
        controller
      );
    }

    // LOAD FURNITURE

    function loadFurnitureModel() {

      const loader =
        new GLTFLoader();

      loader.load(
        furniture.model,

        // Success

        function (gltf) {

          furnitureTemplate =
            gltf.scene;

          furnitureTemplate.scale.set(
            0.5,
            0.5,
            0.5
          );

          console.log(
            `${furniture.name} loaded successfully`
          );

          info.textContent =
            `${furniture.name} ready - press Start AR`;

          startButton.disabled =
            false;
        },

        // Progress
 
        function (xhr) {

          if (xhr.total) {

            const percent =
              Math.round(
                xhr.loaded /
                xhr.total *
                100
              );
            info.textContent =
              `Loading ${furniture.name}: ${percent}%`;
          }
        },

        // Error

        function (error) {

          console.error(
            `${furniture.name} loading error:`,
            error
          );

          info.textContent =
            `Failed to load ${furniture.name} model`;
        }
      );
    }

    // EVENTS

    function setupEvents() {

      startButton.addEventListener(
        'click',
        startAR
      );

      window.addEventListener(
        'resize',
        onWindowResize
      );
    }

    // START AR
  
    async function startAR() {

      if (!navigator.xr) {

        info.textContent =
          'WebXR is not supported on this device/browser.';
        return;
      }

      try {
        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );

        if (!supported) {
          info.textContent =
            'Markerless AR is not supported on this device.';
          return;
        }

        const session =
          await navigator.xr.requestSession(
            'immersive-ar',
            {
              requiredFeatures: [
                'hit-test'
              ],
              optionalFeatures: [
                'dom-overlay',
                'plane-detection'
              ],
              domOverlay: {
                root: document.body
              }

            }
          );

        renderer.xr.setReferenceSpaceType(
          'local'
        );

        localReferenceSpace = await session.requestReferenceSpace('local');

        await renderer.xr.setSession(
          session
        );

        startButton.style.display =
          'none';

        info.textContent =
          'Move your phone slowly to find a surface';

        renderer.setAnimationLoop(
          render
        );

        session.addEventListener(
          'end',
          function () {

            hitTestSource =
              null;

            hitTestSourceRequested =
              false;

            footprintHitTestSources.forEach((source) => source.cancel());
            footprintHitTestSources = [];
            footprintHitTestSourcePromise = null;
            footprintCenter = null;
            localReferenceSpace = null;
            planeDetectionAvailable = false;
            canPlaceFurniture = false;
            reticle.visible = false;
            placementGuide.visible = false;

            startButton.style.display =
              'block';

            info.textContent =
              'AR session ended';

          }
        );
      }
      catch (error) {

        console.error(
          'AR session error:',
          error
        );

        info.textContent =
          'Could not start AR session.';

      }
    }

    // PLACE FURNITURE

    function onSelect() {

      if (!reticle.visible) {

        info.textContent =
          'No surface found yet';

        return;
      }

      if (!canPlaceFurniture) {

        info.textContent =
          'Not enough space for this furniture';

        return;
      }

      if (!furnitureTemplate) {

        info.textContent =
          `${furniture.name} is still loading`;

        return;
      }

      // Clone the loaded model
      const placedObject =
        furnitureTemplate.clone(true);

      // Get reticle position

      const position =
        new THREE.Vector3();


      position.setFromMatrixPosition(
        reticle.matrix
      );

      placedObject.position.copy(
        position
      );

      placedObject.position.y +=
        0.01;

      placedObject.scale.set(
        0.5,
        0.5,
        0.5
      );

      scene.add(
        placedObject
      );

      placedFurniture.push({
        type: furniture.name,
        object3D: placedObject,
        width: getFurnitureSize().width,
        depth: getFurnitureSize().depth,
        boundingBox: createFurnitureBoundingBox(placedObject.position, getFurnitureSize())
      });

      console.log(
        `${furniture.name} placed:`,
        placedObject.position
      );

      info.textContent =
        `${furniture.name} placed successfully`;

    }

    // HIT TEST / RENDER LOOP

    function render(
      timestamp,
      frame
    ) {

      if (frame) {
        const referenceSpace =
          renderer.xr.getReferenceSpace();

        const session =
          renderer.xr.getSession();

          // Request hit test source

        if (
          hitTestSourceRequested ===
          false
        ) {

          session
            .requestReferenceSpace(
              'viewer'
            )
            .then(
              function (
                viewerReferenceSpace
              ) {

                session
                  .requestHitTestSource({
                    space:
                      viewerReferenceSpace
                  })
                  .then(
                    function (source) {

                      hitTestSource =
                        source;

                    }
                  );
              }
            );

          hitTestSourceRequested =
            true;
        }

        // Hit test
  
        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );

          if (
            hitTestResults.length >
            0
          ) {

            const hit =
              hitTestResults[0];

            const pose =
              hit.getPose(
                referenceSpace
              );

            if (pose) {
              reticle.visible =
                true;

              reticle.matrix.fromArray(
                pose.transform.matrix
              );

              const placementPosition = new THREE.Vector3();
              placementPosition.setFromMatrixPosition(reticle.matrix);
              if (
                !footprintCenter ||
                footprintCenter.distanceTo(placementPosition) > 0.15
              ) {
                footprintHitTestSources.forEach((source) => source.cancel());
                footprintHitTestSources = [];
                footprintResults = [false, false, false, false, false];
                createFootprintHitTestSources(placementPosition);
              }
              updatePlacementGuideTransform();
              const hasEnoughFloor = checkAvailableFloorSpace(frame, placementPosition);
              validatePlacement(placementPosition, hasEnoughFloor);
            }
          }
          else {

            reticle.visible =
              false;

            canPlaceFurniture =
              false;

            if (placementGuide) {
              placementGuide.visible = false;
            }

            info.textContent =
              'Move your phone slowly to find a surface';
          }
        }
      }

      renderer.render(
        scene,
        camera
      );
    }

    // RESIZE
    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

  </script>
</body>
</html>
