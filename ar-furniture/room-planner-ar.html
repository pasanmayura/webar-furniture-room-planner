<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plan My Room — WebAR Furniture Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/src/style.css" />

  <style>
    /* ===== Page-specific styles for the AR room planner ===== */
    /* Reuses design tokens (--color-*, --font-*, --radius-*) from style.css */

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--color-dark);
    }

    #arScene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ---------- Top status bar ---------- */
    .ar-status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: max(env(safe-area-inset-top), var(--space-sm)) var(--space-md) var(--space-sm);
      pointer-events: none;
    }

    .ar-status-message {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.9rem;
      color: #ffffff;
      background-color: rgba(35, 38, 31, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 0.6rem 1.1rem;
      text-align: center;
      max-width: 90vw;
    }

    .ar-back-link {
      position: fixed;
      top: max(env(safe-area-inset-top), var(--space-sm));
      left: var(--space-sm);
      z-index: 21;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(35, 38, 31, 0.75);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* ---------- Start AR button ---------- */
    .ar-start-wrap {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(35,38,31,0.55), rgba(35,38,31,0.75));
    }

    .btn-start-ar {
      min-height: 56px;
      padding: 1rem 2.5rem;
      font-size: 1.05rem;
      border-radius: 999px;
      background-color: var(--color-accent);
      color: #ffffff;
      border: none;
      font-weight: 700;
      box-shadow: var(--shadow-soft-hover);
    }

    .btn-start-ar:hover {
      background-color: var(--color-accent-dark);
    }

    .ar-start-wrap.hidden,
    .ar-back-link.hidden {
      display: none !important;
    }

    /* ---------- Furniture selection controls ---------- */
    .furniture-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md) max(env(safe-area-inset-bottom), var(--space-md));
      background: linear-gradient(0deg, rgba(35,38,31,0.85) 40%, rgba(35,38,31,0));
    }

    .furniture-controls.hidden {
      display: none !important;
    }

    .furniture-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      min-width: 76px;
      min-height: 64px;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.25);
      background-color: rgba(255,255,255,0.08);
      color: #ffffff;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.8rem;
    }

    .furniture-btn .furniture-icon {
      font-size: 1.4rem;
    }

    .furniture-btn.selected {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
    }

    .furniture-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .furniture-btn.action {
      min-width: 86px;
      background-color: rgba(255,255,255,0.12);
    }

    /* ---------- Placement toast (e.g. "Not enough space") ---------- */
    .ar-hint {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background-color: rgba(35, 38, 31, 0.75);
      color: #ffffff;
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .ar-hint.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Back link to the main catalogue -->
  <a href="/index.html" class="ar-back-link" id="backLink" aria-label="Back to furniture catalogue">←</a>

  <!-- Top status message -->
  <div class="ar-status-bar">
    <p class="ar-status-message" id="statusMessage">Press Start AR</p>
  </div>

  <!-- Start AR overlay -->
  <div class="ar-start-wrap" id="startWrap">
    <button type="button" class="btn-start-ar" id="startArBtn">Start AR</button>
  </div>

  <!-- Furniture selection controls (shown once AR session is running) -->
  <div class="furniture-controls hidden" id="furnitureControls">
    <button type="button" class="furniture-btn selected" id="btnChair" data-product="chair">
      <span class="furniture-icon" aria-hidden="true">🪑</span>
      Chair
    </button>
    <button type="button" class="furniture-btn" id="btnTable" data-product="table">
      <span class="furniture-icon" aria-hidden="true">🛋️</span>
      Table
    </button>
    <button type="button" class="furniture-btn" id="btnBed" data-product="bed">
      <span class="furniture-icon" aria-hidden="true">🛏️</span>
      Bed
    </button>
    <button type="button" class="furniture-btn action" id="btnRotate" aria-label="Rotate selected furniture">
      ↻ Rotate
    </button>
    <button type="button" class="furniture-btn action" id="btnRemove" aria-label="Remove selected furniture">
      🗑 Remove
    </button>
  </div>

  <!-- Inline hint / toast for transient messages -->
  <p class="ar-hint" id="arHint"></p>

  <canvas id="arScene"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="/src/room-planner-ar.js"></script>
</body>
</html>
