<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>Room Planner AR</title>

    <link rel="stylesheet" href="/markerless-ar.css" />

    <style>
      body {
        background: #000;
      }

      #status {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;

        min-width: min(88vw, 420px);
        padding: 12px 18px;
        border-radius: 12px;

        background: rgba(15, 15, 15, 0.8);
        color: #fff;
        text-align: center;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      #start-ar {
        position: fixed;
        left: 50%;
        bottom: 98px;
        transform: translateX(-50%);
        z-index: 20;

        padding: 16px 30px;
        border: none;
        border-radius: 12px;

        background: #ffffff;
        color: #111111;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      #exit-ar {
        display: none;
        position: fixed;
        right: 20px;
        bottom: 30px;
        z-index: 10;
        padding: 14px 20px;
        border: none;
        border-radius: 8px;
        background: #d94b4b;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      #remove-selected {
        display: none;
        position: fixed;
        right: 18px;
        bottom: 96px;
        z-index: 20;

        padding: 12px 16px;
        border: none;
        border-radius: 10px;

        background: #ef4444;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      #selection-bar {
        display: none;
        position: fixed;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;

        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;

        background: rgba(18, 18, 18, 0.72);
        backdrop-filter: blur(4px);
      }

      .tool-btn {
        min-width: 96px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;

        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      .tool-btn.active {
        background: #4ecdc4;
        color: #0d1117;
        border-color: #4ecdc4;
      }
    </style>
  </head>

  <body>
    <div id="status">Press Start AR</div>

    <button id="start-ar" type="button">Start AR</button>
    <button id="remove-selected" type="button">Remove Selected</button>
    <button id="exit-ar" type="button">Exit AR</button>

    <div id="selection-bar" aria-label="Furniture selection controls">
      <button class="tool-btn active" data-kind="chair" type="button">Chair</button>
      <button class="tool-btn" data-kind="table" type="button">Table</button>
      <button class="tool-btn" data-kind="bed" type="button">Bed</button>
    </div>

    <script type="module" src="/src/room-planner-ar.js"></script>
  </body>
</html>
